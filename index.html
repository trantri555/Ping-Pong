<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ping Pong</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="game.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #dfe4ea;
            color: #2f3542;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 16px;
        }

        .game-container {
            width: 100%;
            max-width: 480px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .top-bar h1 {
            font-size: 22px;
        }
        .top-bar h1 i {
            color: #5f27cd;
            margin-right: 8px;
        }

        .btn {
            background: #ced6e0;
            color: #2f3542;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            background: #a4b0be;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
        }

        .btn-large {
            padding: 10px 18px;
            margin: 0 4px;
        }

        .level-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .level-selector .label {
            color: #57606f;
            font-size: 14px;
        }
        .level-selector #levelBtns {
            display: flex;
            gap: 6px;
        }
        .level-selector .level-btn {
            width: 36px;
            height: 36px;
            font-weight: bold;
        }
        .level-selector .level-btn.active {
            background: #2e86de;
            color: #f1f2f6;
        }

        .hud {
            background: #f1f2f6;
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 12px;
        }
        .hud .level-title {
            font-size: 16px;
            font-weight: bold;
            color: #2e86de;
        }
        .hud .level-desc {
            font-size: 13px;
            color: #57606f;
            line-height: 1.4;
            margin: 4px 0 8px;
        }
        .hud .stats {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
        }
        .hud .stat i {
            margin-right: 4px;
        }
        .hud .fa-heart {
            color: #ee5253;
        }
        .hud .fa-star {
            color: #e58e0a;
        }
        .hud .fa-gauge-high {
            color: #2e86de;
            margin-right: 6px;
        }

        .canvas-wrapper {
            position: relative;
            background: #f1f2f6;
            border-radius: 6px;
            overflow: hidden;
        }
        .canvas-wrapper canvas {
            display: block;
            width: 100%;
            height: auto;
            touch-action: none;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay-box {
            background: #dfe4ea;
            border: 3px solid #2e86de;
            border-radius: 6px;
            padding: 24px;
            min-width: 240px;
            text-align: center;
        }
        .overlay-box h2 {
            margin-bottom: 8px;
        }
        .overlay-box p {
            color: #57606f;
            margin-bottom: 16px;
        }

        .hidden {
            display: none;
        }

        .guide {
            margin-top: 12px;
            font-size: 13px;
            color: #57606f;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="game-container">

        <header class="top-bar">
            <h1><i class="fa-solid fa-table-tennis-paddle-ball"></i>Ping Pong</h1>
            <button id="btnPause" class="btn btn-icon" title="Tạm ngưng / Tiếp tục (phím P)">
                <i id="pauseIcon" class="fa-solid fa-pause"></i>
            </button>
        </header>

        <nav class="level-selector">
            <span class="label">Level:</span>
            <div id="levelBtns"></div>
        </nav>

        <section class="hud">
            <div id="levelName" class="level-title"></div>
            <div class="stats">
                <span class="stat" id="lives"></span>
                <span class="stat"><i class="fa-solid fa-star"></i><span id="score">0</span></span>
                <span class="stat"><i class="fa-solid fa-gauge-high"></i><span id="speed">0</span></span>
            </div>
        </section>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="900" height="940"></canvas>
            <div id="overlay" class="overlay hidden">
                <div class="overlay-box">
                    <h2 id="overlayTitle"></h2>
                    <p id="overlayText"></p>
                    <button id="btnReplay" class="btn btn-large" title="Chơi lại">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                    <button id="btnNext" class="btn btn-large" title="Level tiếp theo">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                </div>
            </div>
        </div>

        <p class="guide">
            Di chuyển: chuột hoặc phím ← → (A / D).<br>
            Bắn bóng: Space hoặc click vào màn chơi. <br>
            Tạm ngưng: phím P.<br>
            Hướng dẫn chơi chi tiết <a href="https://docs.google.com/document/d/14YstpNpl7eymwPL7FTHGNxWC3WXj7Z45/edit?usp=drive_link&ouid=105145285979435730249&rtpof=true&sd=true" target="_blank">tại đây</a>.
        </p>
    </div>

</body>

</html>
