<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ping Pong</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container">

    <header class="top-bar">
        <h1><i class="fa-solid fa-table-tennis-paddle-ball"></i>Ping Pong</h1>
        <button id="btnPause" class="btn btn-icon" title="Tạm ngưng / Tiếp tục (phím P)">
            <i id="pauseIcon" class="fa-solid fa-pause"></i>
        </button>
    </header>

    <nav class="level-selector">
        <span class="label">Level:</span>
        <div id="levelBtns"></div>
    </nav>

    <section class="hud">
        <div id="levelName" class="level-title"></div>
        <div class="stats">
            <span class="stat" id="lives"></span>
            <span class="stat"><i class="fa-solid fa-star"></i><span id="score">0</span></span>
            <span class="stat"><i class="fa-solid fa-gauge-high"></i><span id="speed">0</span></span>
        </div>
    </section>

    <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="680" height="640"></canvas>
    </div>

    <p class="guide">
        Di chuyển: chuột hoặc phím ← → (A / D).<br>
        Bắn bóng: Space hoặc click vào màn chơi. Tạm ngưng: phím P.
    </p>
</div>

<script src="js/config.js"></script><!--config game stats-->
<script src="js/brick.js"></script> <!--brick config-->
<script src="js/paddle.js"></script><!--paddle config-->
<script src="js/ball.js"></script><!--ball config-->
<script src="js/game.js"></script><!--game config-->
<script>
    window.addEventListener("load", () => {
        const canvas = document.getElementById("gameCanvas");
        if (canvas) {
            window.game = new Game(canvas);
        }
    });
</script>
</body>
</html>
