<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ping Pong</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container">

    <header class="top-bar">
        <h1><i class="fa-solid fa-table-tennis-paddle-ball"></i>Ping Pong</h1>
        <button id="btnPause" class="btn btn-icon" title="Tạm ngưng / Tiếp tục (phím P)">
            <i id="pauseIcon" class="fa-solid fa-pause"></i>
        </button>
    </header>

    <nav class="level-selector">
        <span class="label">Level:</span>
        <div id="levelBtns"></div>
    </nav>

    <section class="hud">
        <div id="levelName" class="level-title"></div>
        <div class="stats">
            <span class="stat" id="lives"></span>
            <span class="stat"><i class="fa-solid fa-star"></i><span id="score">0</span></span>
            <span class="stat"><i class="fa-solid fa-gauge-high"></i><span id="speed">0</span></span>
        </div>
    </section>

    <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="900" height="940"></canvas>
        <div id="overlay" class="overlay hidden">
            <div class="overlay-box">
                <h2 id="overlayTitle"></h2>
                <p id="overlayText"></p>
                <button id="btnReplay" class="btn btn-large" title="Chơi lại">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
                <button id="btnNext" class="btn btn-large" title="Level tiếp theo">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
            </div>
        </div>
    </div>

    <p class="guide">
        Di chuyển: chuột hoặc phím ← → (A / D).<br>
        Bắn bóng: Space hoặc click vào màn chơi. <br>
        Tạm ngưng: phím P.
    </p>
</div>

<script src="js/game.js"></script><!--game config-->
</body>
</html>
